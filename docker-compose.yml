version: "3.8"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: nesttalk-postgres
    environment:
      POSTGRES_DB: nesttalk
      POSTGRES_USER: nesttalk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nesttalk_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesttalk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存/消息队列
  redis:
    image: redis:7-alpine
    container_name: nesttalk-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nesttalk-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://nesttalk:${DB_PASSWORD:-nesttalk_secret}@postgres:5432/nesttalk
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - user_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Vue 3 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nesttalk-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  user_data:
